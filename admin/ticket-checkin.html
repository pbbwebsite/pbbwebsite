<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Check-in Tiket — PBB</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#0a0a0c;color:#f4f1e9;font-family:Arial,sans-serif}.checkin{max-width:700px;margin:0 auto;padding:40px 20px}.checkin h1{font-size:clamp(34px,8vw,58px);text-transform:uppercase}.checkin em{color:#ff2a4b;font-style:normal}.panel{border:1px solid #444;padding:22px;margin:18px 0;background:#171715}.panel label{display:block;margin:12px 0 7px;font-size:12px;text-transform:uppercase}.panel input{box-sizing:border-box;width:100%;padding:14px;background:#080808;color:white;border:1px solid #555}.panel button{margin-top:12px;padding:13px 18px;border:0;background:#ff2a4b;color:white;font-weight:bold;cursor:pointer}.message{padding:14px;margin-top:14px;border:1px solid #555;overflow-wrap:anywhere}.message[hidden]{display:none}#reader{width:100%;max-width:440px;margin:12px auto}small{color:#aaa}</style></head><body><main class="checkin"><p>PERSATUAN BOXING BOGOR / ADMIN · <a href="ticket-orders.html" style="color:#ff8798">Pesanan tiket</a></p><h1>VALIDASI<br><em>TIKET.</em></h1><section id="loginPanel" class="panel"><h2>Login admin data</h2><p>Gunakan kata sandi admin platform yang sudah dikonfigurasi di Netlify.</p><form id="loginForm"><label for="password">Kata sandi admin</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button type="submit">Masuk</button></form></section><section id="scanPanel" class="panel" hidden><h2>Periksa tiket masuk</h2><p>Izinkan kamera untuk memindai QR tiket atau masukkan token secara manual.</p><button id="startScan" type="button">Aktifkan kamera</button><div id="reader"></div><form id="tokenForm"><label for="token">Token QR tiket</label><input id="token" autocomplete="off" spellcheck="false" required maxlength="200"><button type="submit">Validasi & Check-in</button></form><button id="logout" type="button">Keluar</button></section><div id="message" class="message" role="status" aria-live="polite" hidden></div></main><script defer src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let scanner=null;function msg(t){$('message').textContent=t;$('message').hidden=false}async function api(action,options={}){const r=await fetch(`/.netlify/functions/cms-api?action=${action}`,{...options,headers:{'content-type':'application/json',...(options.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Permintaan gagal.');return d}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('platform-login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('loginPanel').hidden=true;$('scanPanel').hidden=false;msg('Login berhasil. Siap memvalidasi tiket.')}catch(err){msg(err.message)}});async function check(token){try{const d=await api('ticket-checkin',{method:'POST',body:JSON.stringify({token})});msg(`${d.message} Kode: ${d.ticket.ticket_code}`);$('token').value=''}catch(err){msg(err.message)} }$('tokenForm').addEventListener('submit',e=>{e.preventDefault();check($('token').value.trim())});$('startScan').addEventListener('click',async()=>{if(!window.Html5Qrcode){msg('Pemindai belum termuat. Masukkan token secara manual.');return}try{if(!scanner)scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},decoded=>{scanner.stop().catch(()=>{});$('token').value=decoded;check(decoded)},()=>{});msg('Kamera aktif. Arahkan ke QR tiket.')}catch(err){msg('Kamera tidak dapat diakses. Periksa izin kamera atau masukkan token manual.')}});$('logout').addEventListener('click',async()=>{if(scanner)await scanner.stop().catch(()=>{});await api('platform-logout',{method:'POST',body:'{}'}).catch(()=>{});$('scanPanel').hidden=true;$('loginPanel').hidden=false;$('password').value='';msg('Anda telah keluar dari panel check-in.');});})();
</script></body></html>
